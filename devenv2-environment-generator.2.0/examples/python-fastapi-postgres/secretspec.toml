[project]
name = "myapp"
revision = "1.0"

[profiles.default]
DATABASE_URL   = { description = "PostgreSQL DSN e.g. postgresql://myapp:devpass@127.0.0.1/myapp_dev", required = true }
SECRET_KEY     = { description = "FastAPI/JWT signing key", required = true }
STRIPE_SECRET  = { description = "Stripe secret key", required = false }
SENTRY_DSN     = { description = "Sentry error tracking DSN", required = false }
