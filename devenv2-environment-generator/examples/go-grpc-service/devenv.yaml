inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # devenv.nix uses git-hooks.hooks; the input is not implicit since 2.0.
  git-hooks:
    url: github:cachix/git-hooks.nix

# secretspec.toml ships with this project. A provider is required once the
# integration is enabled.
secretspec:
  enable: true
  provider: env      # keyring | dotenv | env | onepassword | lastpass | ...

require_version: ">=2.2"
