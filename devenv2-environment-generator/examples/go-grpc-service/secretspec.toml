[project]
name = "goapp"
revision = "1.0"
# SecretSpec 0.17 requires an access reason from AI agents by default
# ("agents"). Off for this local dev spec; omit the line to keep the default.
require_reason = false

# required = false lets `devenv shell` succeed before the provider is
# populated; devenv.nix falls back to a local dev DSN for DATABASE_URL.
[profiles.default]
DATABASE_URL      = { description = "PostgreSQL DSN used by goose and the server", required = false }
JWT_SIGNING_KEY   = { description = "Key used to sign gRPC auth tokens", required = false }
OTEL_EXPORTER_OTLP_HEADERS = { description = "Auth headers for the OTLP trace exporter", required = false }
