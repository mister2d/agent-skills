[project]
name = "claude-code-agent-env"
revision = "1.0"
# SecretSpec 0.17 defaults require_reason to "agents", which makes an AI
# agent supply --reason / SECRETSPEC_REASON before secrets are read. Off here
# so the example runs unattended; keep the default for anything shared.
require_reason = false

# required = false lets `devenv shell` succeed before the provider is
# populated. devenv.nix falls back to a local dev DSN for DATABASE_URL.
[profiles.default]
DATABASE_URL      = { description = "PostgreSQL DSN; overrides the dev DSN in devenv.nix", required = false }
ANTHROPIC_API_KEY = { description = "API key for Claude Code / the Claude API", required = false }
