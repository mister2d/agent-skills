[project]
name = "myapp"
revision = "1.0"
# SecretSpec 0.17 defaults require_reason to "agents": an AI agent reading
# secrets must pass --reason / SECRETSPEC_REASON. This is a local dev spec,
# so the requirement is off. Drop this line for shared or production specs.
require_reason = false

# required = false keeps `devenv shell` working before a provider is
# populated. Flip a secret to required = true once it must be present.
[profiles.default]
DATABASE_URL   = { description = "PostgreSQL DSN; overrides the dev DSN in devenv.nix", required = false }
SECRET_KEY     = { description = "FastAPI/JWT signing key", required = false }
STRIPE_SECRET  = { description = "Stripe secret key", required = false }
SENTRY_DSN     = { description = "Sentry error tracking DSN", required = false }
