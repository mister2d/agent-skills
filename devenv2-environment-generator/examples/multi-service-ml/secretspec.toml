[project]
name = "mlops"
revision = "1.0"
# SecretSpec 0.17 requires an access reason from AI agents by default
# ("agents"). Off for this local dev spec.
require_reason = false

# required = false keeps shell entry working before the provider is
# populated; flip to true for secrets that must never be missing.
[profiles.default]
DATABASE_URL          = { description = "PostgreSQL DSN; overrides the dev DSN in devenv.nix", required = false }
AWS_ACCESS_KEY_ID     = { description = "S3 access key (Garage key ID in dev)", required = false }
AWS_SECRET_ACCESS_KEY = { description = "S3 secret key (Garage secret in dev)", required = false }
OPENAI_API_KEY        = { description = "OpenAI API key for LLM calls", required = false }
WANDB_API_KEY         = { description = "Weights & Biases tracking key", required = false }
